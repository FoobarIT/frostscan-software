name: FrostScan Rust Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_name: frostscan
            asset_name: frostscan-linux-x86_64
          - os: macos-latest
            bin_name: frostscan
            asset_name: frostscan-macos-x86_64
          - os: windows-latest
            bin_name: frostscan.exe
            asset_name: frostscan-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare asset (Linux)
        if: runner.os == 'Linux'
        run: cp target/release/${{ matrix.bin_name }} ${{ matrix.asset_name }}

      - name: Prepare asset (macOS)
        if: runner.os == 'macOS'
        run: cp target/release/${{ matrix.bin_name }} ${{ matrix.asset_name }}

      - name: Prepare asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/release/${{ matrix.bin_name }}" "${{ matrix.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"

          gh release create "$tag" \
            --generate-notes \
            dist/**/*
